[shortcut-name]
wire-fix-shortcut=Réorganiser les câbles

[item-name]
wire-fix-tool=Réorganiser les câbles

[item-description]
wire-fix-tool=Réorganise les connexions de câble en cuivre entre les poteaux électriques d'une zone sélectionnée. Les connexions vers les poteaux hors de la sélection sont conservées.

[controls]
give-wire-fix-tool=Obtenir l'outil Réorganiser les câbles

[mod-setting-name]
wire-fix-max-conn=Connexions max. par poteau

[mod-setting-description]
wire-fix-max-conn=Chaque poteau conserve au maximum ce nombre de câbles en cuivre après le nettoyage.

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=__CONTROL_LEFT_CLICK__ et glissez pour reconstruire les câbles en cuivre selon la distance.
right-click=__CONTROL_RIGHT_CLICK__ et glissez pour retirer tous les câbles en cuivre.

no-poles=Aucun poteau électrique dans la sélection
done=__1__ poteaux nettoyés, __2__ câbles
disconnected=__1__ câbles déconnectés sur __2__ poteaux
