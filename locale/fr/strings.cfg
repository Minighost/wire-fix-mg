[shortcut-name]
wire-fix-shortcut=Réorganiser les câbles

[item-name]
wire-fix-tool=Réorganiser les câbles

[item-description]
wire-fix-tool=Réorganise les connexions de câble en cuivre entre les poteaux électriques d'une zone sélectionnée. Les connexions vers les poteaux hors de la sélection sont conservées.

[controls]
give-wire-fix-tool=Obtenir l'outil Réorganiser les câbles

[mod-setting-name]
wire-fix-max-grid=Taille de grille max.
wire-fix-include-ghosts=Inclure les poteaux fantômes

[mod-setting-description]
wire-fix-max-grid=Taille maximale des motifs détectés. Des valeurs plus grandes détectent de plus grands motifs mais sont plus lentes.
wire-fix-include-ghosts=Inclut les poteaux électriques fantômes dans le nettoyage.

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=__CONTROL_LEFT_CLICK__ et glissez pour reconstruire les câbles en cuivre en préservant la séparation des réseaux existante.
shift-left-click=__CONTROL_KEY_SHIFT____CONTROL_STYLE_BEGIN__ + __CONTROL_STYLE_END____CONTROL_LEFT_CLICK__ et glissez pour reconstruire les câbles en cuivre en ignorant la séparation des réseaux.
right-click=__CONTROL_RIGHT_CLICK__ et glissez pour retirer tous les câbles en cuivre.
tip-large-grid=Si de grands motifs ne sont pas détectés, augmentez la Taille de grille max. dans Paramètres des mods → Par joueur.

no-poles=Aucun poteau électrique dans la sélection
done=__1__ poteaux nettoyés, __2__ câbles en cuivre
disconnected=__1__ câbles en cuivre déconnectés sur __2__ poteaux
