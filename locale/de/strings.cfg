[shortcut-name]
wire-fix-shortcut=Kabelaufräumer

[item-name]
wire-fix-tool=Kabelaufräumer

[item-description]
wire-fix-tool=Räumt Stromkabelverbindungen zwischen Strommasten im ausgewählten Bereich auf. Verbindungen zu Masten außerhalb der Auswahl bleiben erhalten.

[controls]
give-wire-fix-tool=Kabelaufräumer-Werkzeug nehmen

[mod-setting-name]
wire-fix-max-grid=Maximale Rastergröße
wire-fix-include-ghosts=Strommast-Geister einbeziehen

[mod-setting-description]
wire-fix-max-grid=Maximale erkannte Mustergröße. Größere Werte erfassen größere Muster, sind jedoch langsamer.
wire-fix-include-ghosts=Bezieht Geister von Strommasten in den Aufräumvorgang ein.

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=__CONTROL_LEFT_CLICK__ und ziehen, um Stromkabel neu zu verbinden und bestehende Netzwerktrennungen beizubehalten.
shift-left-click=__CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ und ziehen, um Stromkabel netzwerkübergreifend neu zu verbinden.
right-click=__CONTROL_RIGHT_CLICK__ und ziehen, um alle Stromkabel zu entfernen.
tip-large-grid=Werden große Muster nicht erkannt, erhöhe die Maximale Rastergröße unter Mod-Einstellungen → Pro Spieler.

no-poles=Keine Strommasten in der Auswahl
done=__1__ Masten bereinigt, __2__ Stromkabel
disconnected=__1__ Stromkabel an __2__ Masten getrennt
