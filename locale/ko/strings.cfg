[shortcut-name]
wire-fix-shortcut=전선 정리기

[item-name]
wire-fix-tool=전선 정리기

[item-description]
wire-fix-tool=선택한 영역 내 전신주 사이의 구리 전선을 정리합니다. 영역 바깥과의 연결은 그대로 유지됩니다.

[controls]
give-wire-fix-tool=전선 정리기 도구 얻기

[mod-setting-name]
wire-fix-max-grid=최대 그리드 크기
wire-fix-include-ghosts=고스트 전신주 포함

[mod-setting-description]
wire-fix-max-grid=감지하는 패턴의 최대 크기. 값이 클수록 더 큰 패턴까지 잡지만 느려집니다.
wire-fix-include-ghosts=고스트 전신주도 포함하여 처리합니다.

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=__CONTROL_LEFT_CLICK__ 키를 누른 채 드래그하면 기존 네트워크 분리를 유지하면서 구리 전선을 연결합니다.
shift-left-click=__CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ 키를 누른 채 드래그하면 네트워크 분리를 무시하고 구리 전선을 연결합니다.
right-click=__CONTROL_RIGHT_CLICK__ 키를 누른 채 드래그하면 영역 내 구리 전선을 모두 끊습니다.
tip-large-grid=큰 패턴이 잡히지 않으면 모드 설정 → 플레이어별에서 최대 그리드 크기를 늘리세요.

no-poles=선택 영역에 전신주가 없습니다
done=__1__개 전신주 정리 완료, 구리 전선 __2__개
disconnected=__2__개 전신주의 내부 구리 전선 __1__개 해제
