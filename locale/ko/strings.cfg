[shortcut-name]
wire-fix-shortcut=전선 정리

[item-name]
wire-fix-tool=전선 정리

[item-description]
wire-fix-tool=평행사변형 패턴을 감지하여 선택한 범위의 구리 전선 연결을 정리합니다.

[controls]
give-wire-fix-tool=전선 정리 도구 얻기

[mod-setting-name]
wire-fix-max-grid=최대 패턴 크기
wire-fix-include-ghosts=고스트 상태의 전신주 포함 여부

[mod-setting-description]
wire-fix-max-grid=감지하는 평행사변형의 최대 크기. 값이 클수록 더 큰 평행사변형 패턴도 잡지만 느려집니다.
wire-fix-include-ghosts=고스트 상태의 전신주도 함께 처리합니다.

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=__CONTROL_LEFT_CLICK__ 후 드래그하면 구리 전선 연결을 정리합니다. 분리된 네트워크를 보호합니다.
shift-left-click=__CONTROL_KEY_SHIFT____CONTROL_STYLE_BEGIN__ + __CONTROL_STYLE_END____CONTROL_LEFT_CLICK__ 후 드래그하면 구리 전선 연결을 정리합니다. 범위 내 모든 전신주를 하나로 연결합니다.
right-click=__CONTROL_RIGHT_CLICK__ 키를 누른 채 드래그하면 구리 전선 연결을 모두 끊습니다.
tip-large-grid=큰 평행사변형이 잡히지 않으면 모드 설정 → 플레이어별에서 최대 패턴 크기를 늘리세요.

no-poles=선택 영역에 전신주가 없습니다
done=__1__개 전신주 정리 완료, 구리 전선 __2__개
disconnected=__2__개 전신주의 내부 구리 전선 __1__개 해제 
