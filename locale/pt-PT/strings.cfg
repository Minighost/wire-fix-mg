[shortcut-name]
wire-fix-shortcut=Organizar cabos

[item-name]
wire-fix-tool=Organizar cabos

[item-description]
wire-fix-tool=Organiza as ligações de fio de cobre entre postes eléctricos na área seleccionada. As ligações a postes fora da selecção são preservadas.

[controls]
give-wire-fix-tool=Obter ferramenta Organizar cabos

[mod-setting-name]
wire-fix-max-grid=Tamanho máximo da grelha
wire-fix-include-ghosts=Incluir decalques de postes

[mod-setting-description]
wire-fix-max-grid=Tamanho máximo de padrão detectado. Valores maiores detectam padrões maiores mas são mais lentos.
wire-fix-include-ghosts=Inclui decalques de postes eléctricos na organização.

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=__CONTROL_LEFT_CLICK__ e arraste para reconstruir os fios de cobre preservando a separação de redes existente.
shift-left-click=__CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ e arraste para reconstruir os fios de cobre ignorando a separação de redes.
right-click=__CONTROL_RIGHT_CLICK__ e arraste para remover todos os fios de cobre.
tip-large-grid=Se padrões grandes não forem detectados, aumente o Tamanho máximo da grelha em Configurações dos mods → Por jogador.

no-poles=Não existem postes eléctricos na selecção
done=__1__ postes organizados, __2__ fios de cobre
disconnected=__1__ fios de cobre desligados em __2__ postes
