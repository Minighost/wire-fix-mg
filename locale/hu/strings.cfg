wire-fix-max-grid=Maximális rácsméret
wire-fix-include-ghosts=Oszlopok szellemképének beleértése

[mod-setting-description]
wire-fix-max-grid=A felismert minta legnagyobb mérete. Nagyobb érték nagyobb mintákat is felismer, de lassabb.
wire-fix-include-ghosts=A villanyoszlopok szellemképét is beleérti a rendezésbe.

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=__CONTROL_LEFT_CLICK__ és húzd az elektromos kábelek újrakötéséhez a meglévő hálózati elkülönítés megőrzésével.
shift-left-click=__CONTROL_KEY_SHIFT____CONTROL_STYLE_BEGIN__ + __CONTROL_STYLE_END____CONTROL_LEFT_CLICK__ és húzd az elektromos kábelek újrakötéséhez a hálózati elkülönítés figyelmen kívül hagyásával.
right-click=__CONTROL_RIGHT_CLICK__ és húzd az összes elektromos kábel eltávolításához.
tip-large-grid=Ha nagy mintákat nem érzékel, növeld a Maximális rácsméretet a Modbeállítások → Játékosonként menüben.

no-poles=Nincs villanyoszlop a kijelölésben
