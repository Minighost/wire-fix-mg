[shortcut-name]
wire-fix-shortcut=Уборка кабелей

[item-name]
wire-fix-tool=Уборка кабелей

[item-description]
wire-fix-tool=Приводит в порядок медные провода между опорами ЛЭП в выделенной области. Соединения с опорами вне выделения сохраняются.

[controls]
give-wire-fix-tool=Получить инструмент «Уборка кабелей»

[mod-setting-name]
wire-fix-max-grid=Макс. размер сетки
wire-fix-include-ghosts=Учитывать планы опор

[mod-setting-description]
wire-fix-max-grid=Максимальный размер обнаруживаемого узора. Бо́льшие значения находят более крупные узоры, но работают медленнее.
wire-fix-include-ghosts=Учитывает планы опор ЛЭП при уборке.

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=__CONTROL_LEFT_CLICK__ и перетащите, чтобы перестроить медные провода с сохранением существующего разделения сетей.
shift-left-click=__CONTROL_KEY_SHIFT____CONTROL_STYLE_BEGIN__ + __CONTROL_STYLE_END____CONTROL_LEFT_CLICK__ и перетащите, чтобы перестроить медные провода, игнорируя разделение сетей.
right-click=__CONTROL_RIGHT_CLICK__ и перетащите, чтобы удалить все медные провода.
tip-large-grid=Если крупные узоры не распознаются, увеличьте Макс. размер сетки в Настройки модов → Для каждого игрока.

no-poles=В выделении нет опор ЛЭП
done=Очищено опор: __1__, медных проводов: __2__
disconnected=Отключено __1__ медных проводов на __2__ опорах
