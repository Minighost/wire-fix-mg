[mod-setting-description]
wire-fix-max-conn=Μετά τον καθαρισμό, κάθε στύλος διατηρεί το πολύ τόσα καλώδια χαλκού.

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=__CONTROL_LEFT_CLICK__ και σύρετε για να ξαναχτίσετε τα καλώδια χαλκού κατά απόσταση.
right-click=__CONTROL_RIGHT_CLICK__ και σύρετε για να αφαιρέσετε όλα τα καλώδια χαλκού.

no-poles=Δεν υπάρχουν στύλοι ηλεκτρικού ρεύματος στην επιλογή
