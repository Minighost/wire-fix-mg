[shortcut-name]
wire-fix-shortcut=Τακτοποίηση καλωδίων

[item-name]
wire-fix-tool=Τακτοποίηση καλωδίων

[item-description]
wire-fix-tool=Τακτοποιεί τις συνδέσεις σύρματος χαλκού μεταξύ των στύλων ηλεκτρικού ρεύματος στην επιλεγμένη περιοχή. Οι συνδέσεις με στύλους εκτός της επιλογής διατηρούνται.

[controls]
give-wire-fix-tool=Λάβετε το εργαλείο Τακτοποίηση καλωδίων

[mod-setting-name]
wire-fix-max-grid=Μέγ. μέγεθος πλέγματος
wire-fix-include-ghosts=Συμπερίληψη ειδώλων στύλων

[mod-setting-description]
wire-fix-max-grid=Μέγιστο μέγεθος μοτίβου που ανιχνεύεται. Μεγαλύτερες τιμές πιάνουν μεγαλύτερα μοτίβα, αλλά είναι πιο αργές.
wire-fix-include-ghosts=Συμπεριλαμβάνει τα είδωλα των στύλων ηλεκτρικού ρεύματος στην τακτοποίηση.

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=__CONTROL_LEFT_CLICK__ και σύρετε για να ξαναχτίσετε τα σύρματα χαλκού διατηρώντας τον υπάρχοντα διαχωρισμό δικτύων.
shift-left-click=__CONTROL_KEY_SHIFT____CONTROL_STYLE_BEGIN__ + __CONTROL_STYLE_END____CONTROL_LEFT_CLICK__ και σύρετε για να ξαναχτίσετε τα σύρματα χαλκού αγνοώντας τον διαχωρισμό δικτύων.
right-click=__CONTROL_RIGHT_CLICK__ και σύρετε για να αφαιρέσετε όλα τα σύρματα χαλκού.
tip-large-grid=Αν δεν εντοπίζονται μεγάλα μοτίβα, αυξήστε το Μέγ. μέγεθος πλέγματος στις Ρυθμίσεις mod → Ανά παίκτη.

no-poles=Δεν υπάρχουν στύλοι ηλεκτρικού ρεύματος στην επιλογή
done=Καθαρίστηκαν __1__ στύλοι, __2__ σύρματα χαλκού
disconnected=Αποσυνδέθηκαν __1__ σύρματα χαλκού σε __2__ στύλους
