[item-description]
wire-fix-tool=Τακτοποιεί τις συνδέσεις καλωδίων χαλκού μεταξύ των στύλων ηλεκτρικού ρεύματος στην επιλεγμένη περιοχή. Οι συνδέσεις με στύλους εκτός της επιλογής διατηρούνται.

[controls]
give-wire-fix-tool=Λάβετε το εργαλείο Τακτοποίηση καλωδίων

[mod-setting-name]
