[shortcut-name]
wire-fix-shortcut=Sắp xếp cáp điện

[item-name]
wire-fix-tool=Sắp xếp cáp điện

[item-description]
wire-fix-tool=Sắp xếp lại các kết nối dây đồng giữa các cột điện trong vùng đã chọn. Các kết nối tới cột nằm ngoài vùng chọn sẽ được giữ nguyên.

[controls]
give-wire-fix-tool=Lấy công cụ Sắp xếp cáp điện

[mod-setting-name]
wire-fix-max-grid=Kích thước lưới tối đa
wire-fix-include-ghosts=Bao gồm cột điện ảo

[mod-setting-description]
wire-fix-max-grid=Kích thước mẫu tối đa được phát hiện. Giá trị lớn hơn bắt được mẫu lớn hơn nhưng chạy chậm hơn.
wire-fix-include-ghosts=Bao gồm các cột điện ảo trong việc sắp xếp.

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=Giữ __CONTROL_LEFT_CLICK__ và kéo để nối lại dây đồng, giữ nguyên sự tách biệt mạng hiện có.
shift-left-click=Giữ __CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ và kéo để nối lại dây đồng, bỏ qua sự tách biệt mạng.
right-click=Giữ __CONTROL_RIGHT_CLICK__ và kéo để gỡ bỏ toàn bộ dây đồng.
tip-large-grid=Nếu mẫu lớn không được phát hiện, hãy tăng Kích thước lưới tối đa trong Cài đặt mod → Từng người chơi.

no-poles=Không có cột điện trong vùng chọn
done=Đã sắp xếp __1__ cột, __2__ dây đồng
disconnected=Đã ngắt __1__ dây đồng trên __2__ cột
