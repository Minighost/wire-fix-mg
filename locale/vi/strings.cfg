[item-description]
wire-fix-tool=Sắp xếp lại các kết nối cáp đồng giữa các cột điện trong vùng đã chọn. Các kết nối tới cột nằm ngoài vùng chọn sẽ được giữ nguyên.

[controls]
give-wire-fix-tool=Lấy công cụ Sắp xếp cáp điện

[mod-setting-name]
