[mod-setting-description]
wire-fix-max-conn=Sau khi sắp xếp, mỗi cột giữ tối đa số cáp đồng này.

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=__CONTROL_LEFT_CLICK__ và kéo để nối lại cáp đồng theo khoảng cách.
right-click=__CONTROL_RIGHT_CLICK__ và kéo để gỡ bỏ toàn bộ cáp đồng.

no-poles=Không có cột điện trong vùng chọn
done=Đã sắp xếp __1__ cột, __2__ cáp
