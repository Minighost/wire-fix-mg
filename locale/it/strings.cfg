[shortcut-name]
wire-fix-shortcut=Sistema cavi

[item-name]
wire-fix-tool=Sistema cavi

[item-description]
wire-fix-tool=Riordina le connessioni di filo di rame tra i pali dell'elettricità nell'area selezionata. Le connessioni ai pali fuori dalla selezione vengono mantenute.

[controls]
give-wire-fix-tool=Ottieni lo strumento Sistema cavi

[mod-setting-name]
wire-fix-max-grid=Dimensione massima della griglia
wire-fix-include-ghosts=Includi pali fantasma

[mod-setting-description]
wire-fix-max-grid=Dimensione massima dei motivi rilevati. Valori più alti rilevano motivi più grandi ma sono più lenti.
wire-fix-include-ghosts=Include i pali dell'elettricità fantasma nella pulizia.

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=__CONTROL_LEFT_CLICK__ e trascina per ricostruire i fili di rame mantenendo la separazione delle reti esistenti.
shift-left-click=__CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ e trascina per ricostruire i fili di rame ignorando la separazione delle reti.
right-click=__CONTROL_RIGHT_CLICK__ e trascina per rimuovere tutti i fili di rame.
tip-large-grid=Se i motivi grandi non vengono rilevati, aumenta la Dimensione massima della griglia in Impostazioni mod → Per ogni giocatore.

no-poles=Nessun palo dell'elettricità nella selezione
done=__1__ pali sistemati, __2__ fili di rame
disconnected=Scollegati __1__ fili di rame su __2__ pali
