[item-name]
wire-fix-tool=Sistema cavi

[item-description]
wire-fix-tool=Riordina le connessioni di cavo di rame tra i pali dell'elettricità nell'area selezionata. Le connessioni ai pali fuori dalla selezione vengono mantenute.

[controls]
give-wire-fix-tool=Ottieni lo strumento Sistema cavi

[mod-setting-name]
wire-fix-max-conn=Connessioni max per palo

[mod-setting-description]
wire-fix-max-conn=Ogni palo conserva al massimo questo numero di cavi di rame dopo la pulizia.

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=__CONTROL_LEFT_CLICK__ e trascina per ricostruire i cavi di rame in base alla distanza.
right-click=__CONTROL_RIGHT_CLICK__ e trascina per rimuovere tutti i cavi di rame.

no-poles=Nessun palo dell'elettricità nella selezione
done=__1__ pali sistemati, __2__ cavi
disconnected=Scollegati __1__ cavi su __2__ pali
