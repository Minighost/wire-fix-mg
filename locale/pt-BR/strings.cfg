[shortcut-name]
wire-fix-shortcut=Organizar cabos

[item-name]
wire-fix-tool=Organizar cabos

[item-description]
wire-fix-tool=Organiza as conexões de cabo de cobre entre postes na área selecionada. As conexões com postes fora da seleção são preservadas.

[controls]
give-wire-fix-tool=Obter ferramenta Organizar cabos

[mod-setting-name]
wire-fix-max-grid=Tamanho máximo da grade
wire-fix-include-ghosts=Incluir postes fantasmas

[mod-setting-description]
wire-fix-max-grid=Tamanho máximo do padrão detectado. Valores maiores detectam padrões maiores, porém ficam mais lentos.
wire-fix-include-ghosts=Inclui postes fantasmas na organização.

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=__CONTROL_LEFT_CLICK__ e arraste para reconstruir os cabos de cobre preservando a separação de redes existente.
shift-left-click=__CONTROL_KEY_SHIFT____CONTROL_STYLE_BEGIN__ + __CONTROL_STYLE_END____CONTROL_LEFT_CLICK__ e arraste para reconstruir os cabos de cobre ignorando a separação de redes.
right-click=__CONTROL_RIGHT_CLICK__ e arraste para remover todos os cabos de cobre.
tip-large-grid=Se padrões grandes não forem detectados, aumente o Tamanho máximo da grade em Configurações dos mods → Por jogador.

no-poles=Nenhum poste na seleção
done=__1__ postes organizados, __2__ cabos de cobre
disconnected=__1__ cabos de cobre desconectados em __2__ postes
