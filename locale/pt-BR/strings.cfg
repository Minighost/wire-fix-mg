[item-name]
wire-fix-tool=Organizar cabos

[item-description]
wire-fix-tool=Organiza as conexões de cabo de cobre entre postes elétricos na área selecionada. As conexões com postes fora da seleção são preservadas.

[controls]
give-wire-fix-tool=Obter ferramenta Organizar cabos

[mod-setting-name]
