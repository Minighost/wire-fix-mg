[mod-setting-description]
wire-fix-max-conn=Cada poste mantém no máximo essa quantidade de cabos de cobre após a limpeza.

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
