[shortcut-name]
wire-fix-shortcut=電線整理

[item-name]
wire-fix-tool=電線整理

[item-description]
wire-fix-tool=選択範囲内の電柱間の銅ケーブル接続を整理します。範囲外の電柱への接続はそのまま保持されます。

[controls]
give-wire-fix-tool=電線整理ツールを入手

[mod-setting-name]
wire-fix-max-grid=最大グリッドサイズ
wire-fix-include-ghosts=ゴースト電柱を含める

[mod-setting-description]
wire-fix-max-grid=検出するパターンの最大サイズ。値を大きくするほど大きなパターンを検出できますが、処理が遅くなります。
wire-fix-include-ghosts=ゴースト電柱も処理対象に含めます。

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=__CONTROL_LEFT_CLICK__ を押しながらドラッグすると、既存のネットワーク分離を保持したまま銅ケーブルを再接続します。
shift-left-click=__CONTROL_KEY_SHIFT____CONTROL_STYLE_BEGIN__ + __CONTROL_STYLE_END____CONTROL_LEFT_CLICK__ を押しながらドラッグすると、ネットワーク分離を無視して銅ケーブルを再接続します。
right-click=__CONTROL_RIGHT_CLICK__ を押しながらドラッグすると、銅ケーブルをすべて切断します。
tip-large-grid=大きなパターンが検出されない場合は、MOD設定 → 個人設定で最大グリッドサイズを大きくしてください。

no-poles=選択範囲内に電柱がありません
done=__1__本の電柱を整理、銅ケーブル__2__本
disconnected=__2__本の電柱間の銅ケーブル__1__本を切断
