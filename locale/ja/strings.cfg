[shortcut-name]
wire-fix-shortcut=電線整理

[item-name]
wire-fix-tool=電線整理

[item-description]
wire-fix-tool=選択範囲内の電柱間の銅線接続を整理します。範囲外の電柱への接続はそのまま保持されます。

[controls]
give-wire-fix-tool=電線整理ツールを入手

[mod-setting-name]
wire-fix-max-conn=電柱あたりの最大接続数

[mod-setting-description]
wire-fix-max-conn=整理後、各電柱が保持する銅線接続の最大数。

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=__CONTROL_LEFT_CLICK__ を押しながらドラッグすると、距離に基づいて銅線を再接続します。
right-click=__CONTROL_RIGHT_CLICK__ を押しながらドラッグすると、銅線をすべて切断します。

no-poles=選択範囲内に電柱がありません
done=__1__本の電柱を整理、銅線__2__本
disconnected=__2__本の電柱間の銅線__1__本を切断
