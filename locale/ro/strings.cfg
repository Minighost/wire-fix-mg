[shortcut-name]
wire-fix-shortcut=Aranjare cabluri

[item-name]
wire-fix-tool=Aranjare cabluri

[item-description]
wire-fix-tool=Aranjează conexiunile de cablu de cupru între stâlpii electrici din zona selectată. Conexiunile către stâlpii din afara selecției sunt păstrate.

[controls]
give-wire-fix-tool=Obține unealta Aranjare cabluri

[mod-setting-name]
wire-fix-max-grid=Dimensiune maximă a grilei
wire-fix-include-ghosts=Include stâlpii fantomă

[mod-setting-description]
wire-fix-max-grid=Dimensiunea maximă a modelului detectat. Valorile mai mari prind modele mai mari, dar rulează mai lent.
wire-fix-include-ghosts=Include stâlpii electrici fantomă în aranjare.

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=__CONTROL_LEFT_CLICK__ și trage pentru a reface cablurile de cupru păstrând separarea existentă a rețelelor.
shift-left-click=__CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ și trage pentru a reface cablurile de cupru ignorând separarea rețelelor.
right-click=__CONTROL_RIGHT_CLICK__ și trage pentru a elimina toate cablurile de cupru.
tip-large-grid=Dacă modelele mari nu sunt detectate, mărește Dimensiunea maximă a grilei din Setări mod → Per jucător.

no-poles=Niciun stâlp electric în selecție
done=__1__ stâlpi aranjați, __2__ cabluri de cupru
disconnected=__1__ cabluri de cupru deconectate la __2__ stâlpi
