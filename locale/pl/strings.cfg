[shortcut-name]
wire-fix-shortcut=Porządkowanie drutów

[item-name]
wire-fix-tool=Porządkowanie drutów

[item-description]
wire-fix-tool=Porządkuje połączenia drutu miedzianego między słupami elektrycznymi w zaznaczonym obszarze. Połączenia ze słupami spoza zaznaczenia są zachowywane.

[controls]
give-wire-fix-tool=Weź narzędzie Porządkowanie drutów

[mod-setting-name]
wire-fix-max-grid=Maksymalny rozmiar siatki
wire-fix-include-ghosts=Uwzględniaj projekcje słupów

[mod-setting-description]
wire-fix-max-grid=Maksymalny wykrywany rozmiar wzorca. Większe wartości wykrywają większe wzorce, ale są wolniejsze.
wire-fix-include-ghosts=Uwzględnia projekcje słupów elektrycznych przy porządkowaniu.

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=__CONTROL_LEFT_CLICK__ i przeciągnij, aby na nowo połączyć druty miedziane, zachowując istniejące oddzielenie sieci.
shift-left-click=__CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ i przeciągnij, aby na nowo połączyć druty miedziane, ignorując oddzielenie sieci.
right-click=__CONTROL_RIGHT_CLICK__ i przeciągnij, aby usunąć wszystkie druty miedziane.
tip-large-grid=Jeśli duże wzorce nie są wykrywane, zwiększ Maksymalny rozmiar siatki w Modyfikacje → Na gracza.

no-poles=Brak słupów elektrycznych w zaznaczeniu
done=Uporządkowano __1__ słupów, __2__ drutów miedzianych
disconnected=Odłączono __1__ drutów miedzianych na __2__ słupach
