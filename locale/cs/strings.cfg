wire-fix-tool=Úklid kabelů

[item-description]
wire-fix-tool=Uspořádá měděné dráty mezi elektrickými sloupy ve vybrané oblasti. Spojení se sloupy mimo výběr jsou zachována.

[controls]
give-wire-fix-tool=Vzít nástroj Úklid kabelů

[mod-setting-name]
wire-fix-max-grid=Maximální velikost mřížky
wire-fix-include-ghosts=Zahrnout duchy sloupů

[mod-setting-description]
wire-fix-max-grid=Maximální velikost rozpoznaného vzoru. Vyšší hodnoty zachytí větší vzory, ale jsou pomalejší.
wire-fix-include-ghosts=Zahrne duchy elektrických sloupů do úklidu.

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=__CONTROL_LEFT_CLICK__ a táhnutím obnovíte měděné dráty se zachováním stávajícího oddělení sítí.
shift-left-click=__CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ a táhnutím obnovíte měděné dráty bez ohledu na oddělení sítí.
right-click=__CONTROL_RIGHT_CLICK__ a táhnutím odeberete všechny měděné dráty.
tip-large-grid=Pokud nejsou zachyceny velké vzory, zvyšte Maximální velikost mřížky v Nastavení modů → Na hráče.

no-poles=Ve výběru nejsou žádné elektrické sloupy
done=Uklizeno __1__ sloupů, __2__ měděných drátů
disconnected=Odpojeno __1__ měděných drátů na __2__ sloupech
