[shortcut-name]
wire-fix-shortcut=電線整理

[item-name]
wire-fix-tool=電線整理

[item-description]
wire-fix-tool=整理選取區域內電線桿之間的銅電線連接。區域外電線桿的連接會被保留。

[controls]
give-wire-fix-tool=取得電線整理工具

[mod-setting-name]
wire-fix-max-conn=每根電線桿最大連接數

[mod-setting-description]
wire-fix-max-conn=整理後每根電線桿最多保留的銅電線連接數量。

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=按 __CONTROL_LEFT_CLICK__ 並拖曳以依距離重新連接銅電線。
right-click=按 __CONTROL_RIGHT_CLICK__ 並拖曳以移除所有銅電線。

no-poles=選取區域內沒有電線桿
done=已整理 __1__ 根電線桿,共 __2__ 根銅電線
disconnected=已切斷 __2__ 根電線桿之間的 __1__ 根銅電線
