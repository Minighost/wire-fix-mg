[shortcut-name]
wire-fix-shortcut=電線整理

[item-name]
wire-fix-tool=電線整理

[item-description]
wire-fix-tool=整理選取區域內電線桿之間的銅電線連接。區域外電線桿的連接會被保留。

[controls]
give-wire-fix-tool=取得電線整理工具

[mod-setting-name]
wire-fix-max-grid=最大網格大小
wire-fix-include-ghosts=包含電線桿預覽

[mod-setting-description]
wire-fix-max-grid=可偵測圖樣的最大尺寸。數值越大可偵測越大的圖樣，但執行速度較慢。
wire-fix-include-ghosts=整理時將電線桿預覽一併納入。

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=按住 __CONTROL_LEFT_CLICK__ 拖曳，在保留現有網路分隔的情況下重新連接銅電線。
shift-left-click=按住 __CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ 拖曳，忽略網路分隔重新連接銅電線。
right-click=按住 __CONTROL_RIGHT_CLICK__ 拖曳以移除所有銅電線。
tip-large-grid=若無法偵測大型圖樣，請在 模組設定 → 個別玩家設定 中提高最大網格大小。

no-poles=選取區域內沒有電線桿
done=已整理 __1__ 根電線桿,共 __2__ 根銅電線
disconnected=已切斷 __2__ 根電線桿之間的 __1__ 根銅電線
