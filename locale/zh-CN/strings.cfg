[shortcut-name]
wire-fix-shortcut=电缆整理

[item-name]
wire-fix-tool=电缆整理

[item-description]
wire-fix-tool=整理选定区域内电线杆之间的铜线连接。与区域外电线杆的连接将被保留。

[controls]
give-wire-fix-tool=获取电缆整理工具

[mod-setting-name]
wire-fix-max-grid=最大网格大小
wire-fix-include-ghosts=包含电线杆虚影

[mod-setting-description]
wire-fix-max-grid=可识别图案的最大尺寸。值越大，可捕捉的图案越大，但速度越慢。
wire-fix-include-ghosts=整理时包含电线杆虚影。

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=按住 __CONTROL_LEFT_CLICK__ 拖动可在保留现有网络分隔的前提下重连铜线。
shift-left-click=按住 __CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ 拖动可忽略网络分隔重连铜线。
right-click=按住 __CONTROL_RIGHT_CLICK__ 拖动可移除所有铜线。
tip-large-grid=若大型图案无法识别，请在 模组设置 → 个性设置 中提高最大网格大小。

no-poles=选区内没有电线杆
done=已整理 __1__ 根电线杆,共 __2__ 根铜线
disconnected=已断开 __2__ 根电线杆之间的 __1__ 根铜线
