[shortcut-name]
wire-fix-shortcut=电缆整理

[item-name]
wire-fix-tool=电缆整理

[item-description]
wire-fix-tool=整理选定区域内电线杆之间的铜缆连接。与区域外电线杆的连接将被保留。

[controls]
give-wire-fix-tool=获取电缆整理工具

[mod-setting-name]
wire-fix-max-conn=每根电线杆的最大连接数

[mod-setting-description]
wire-fix-max-conn=整理后每根电线杆最多保留的铜缆连接数量。

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=按 __CONTROL_LEFT_CLICK__ 并拖动可按距离重建铜缆连接。
right-click=按 __CONTROL_RIGHT_CLICK__ 并拖动可移除所有铜缆。

no-poles=选区内没有电线杆
done=已整理 __1__ 根电线杆,共 __2__ 根铜缆
disconnected=已断开 __2__ 根电线杆之间的 __1__ 根铜缆
