[shortcut-name]
wire-fix-shortcut=Organizar cables

[item-name]
wire-fix-tool=Organizar cables

[item-description]
wire-fix-tool=Reorganiza las conexiones de cable de cobre entre los postes eléctricos del área seleccionada. Se mantienen las conexiones a postes fuera de la selección.

[controls]
give-wire-fix-tool=Obtener herramienta Organizar cables

[mod-setting-name]
wire-fix-max-grid=Tamaño máximo de la cuadrícula
wire-fix-include-ghosts=Incluir postes fantasma

[mod-setting-description]
wire-fix-max-grid=Tamaño máximo de patrón detectado. Valores mayores detectan patrones más grandes pero son más lentos.
wire-fix-include-ghosts=Incluye los postes eléctricos fantasma en la limpieza.

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=__CONTROL_LEFT_CLICK__ y arrastrar para reconstruir los cables de cobre conservando la separación de redes existente.
shift-left-click=__CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ y arrastrar para reconstruir los cables de cobre ignorando la separación de redes.
right-click=__CONTROL_RIGHT_CLICK__ y arrastrar para quitar todos los cables de cobre.
tip-large-grid=Si no se detectan patrones grandes, aumenta el Tamaño máximo de la cuadrícula en Configuración de mods → Por jugador.

no-poles=No hay postes eléctricos en la selección
done=__1__ postes organizados, __2__ cables de cobre
disconnected=__1__ cables de cobre desconectados en __2__ postes
