[item-description]
wire-fix-tool=Упорядковує мідні дроти між опорами ЛЕП у виділеній області. З'єднання з опорами поза виділенням зберігаються.

[controls]
give-wire-fix-tool=Отримати інструмент «Прибирання дротів»

[mod-setting-name]
wire-fix-max-grid=Макс. розмір сітки
wire-fix-include-ghosts=Включати привидів опор

[mod-setting-description]
wire-fix-max-grid=Максимальний розмір розпізнаваного візерунка. Більші значення знаходять більші візерунки, але працюють повільніше.
wire-fix-include-ghosts=Включає привидів опор ЛЕП у прибирання.

[wire-fix]
bullet=[font=default-semibold][color=#ffe6c0]  •   __1__[/color][/font]
left-click=__CONTROL_LEFT_CLICK__ і перетягніть, щоб перебудувати мідні дроти зі збереженням наявного розділення мереж.
shift-left-click=__CONTROL_KEY_SHIFT____CONTROL_STYLE_BEGIN__ + __CONTROL_STYLE_END____CONTROL_LEFT_CLICK__ і перетягніть, щоб перебудувати мідні дроти, ігноруючи розділення мереж.
right-click=__CONTROL_RIGHT_CLICK__ і перетягніть, щоб видалити всі мідні дроти.
tip-large-grid=Якщо великі візерунки не розпізнаються, збільште Макс. розмір сітки в Налаштування модів → Для кожного гравця.

no-poles=У виділенні немає опор ЛЕП
done=Прибрано __1__ опор, мідних дротів: __2__
disconnected=Від'єднано __1__ мідних дротів на __2__ опорах
